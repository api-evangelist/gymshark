aid: gymshark
name: Gymshark
description: 'Gymshark is a British fitness apparel and accessories brand founded in
  2012 in Birmingham, England, selling gym and workout clothing direct to consumers
  worldwide through gymshark.com, a set of regional storefronts (uk., eu., row., de.,
  fr., ca., au. and others) and its Gymshark Shop and Gymshark Training mobile apps.
  The storefront runs on Shopify behind a headless Next.js/OpenNext front end deployed
  on AWS, and customer identity is handled by an Auth0 tenant Gymshark operates on
  its own domain at auth.gymshark.com. Gymshark publishes no public developer portal,
  no developer documentation and no public product API; the only publicly discoverable
  machine-readable contract on its own hosts is the OpenID Connect / OAuth 2.0 authorization-server
  metadata served from auth.gymshark.com. Its engineering team does publish open-source
  Go, JavaScript and Swift libraries under the github.com/gymshark organization, and
  it runs a public vulnerability disclosure program on HackerOne.'
