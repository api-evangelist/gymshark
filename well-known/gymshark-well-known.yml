method: searched
source: live probe of every Gymshark host discovered via DNS and the storefront markup
note: >-
  Gymshark publishes no developer portal and no product API. The only Gymshark host
  serving real machine-readable discovery documents is auth.gymshark.com, the Auth0
  tenant it operates on its own domain for customer accounts. Probed hosts with no
  hits are recorded here so a later run does not re-litigate them. track.gymshark.com
  is an SPA catch-all that answers HTTP 200 with an HTML shell for every /.well-known/*
  path — every "200" it returned was rejected as a false positive and is recorded as
  such below.
